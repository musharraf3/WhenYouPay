<text x="64" y="76" font-size="36" font-weight="700" fill="#0b0b0b">$60 a month, every month. December bills $181.19.</text>
<text x="64" y="116" font-size="21" fill="#52514e">A steady prescription and no shock. The bill climbs because the balance has fewer months left to divide into.</text>
<text x="64" y="730" font-size="16" fill="#8a8a84">Medicare publishes the same shape: its $80-a-month example ends at $241.53 · github.com/musharraf3/WhenYouPay</text>
