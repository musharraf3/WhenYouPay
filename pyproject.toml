[project]
name = "whenyoupay"
version = "0.2.0"
description = "What the Medicare Prescription Payment Plan does to your year. It changes when you pay, never what you owe."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Musharraf Shaikh" }]
keywords = ["medicare", "part-d", "health-policy", "prescription-costs",
            "healthcare", "cms", "public-benefits"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/musharraf3/WhenYouPay"
Repository = "https://github.com/musharraf3/WhenYouPay"
Issues = "https://github.com/musharraf3/WhenYouPay/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
whenyoupay = "whenyoupay.cli:main"

# Flat layout with several top-level directories (tests, evals, figures,
# results) leaves setuptools unable to guess what the package is, and it
# refuses rather than picking. Naming it explicitly is the documented fix.
[tool.setuptools]
packages = ["whenyoupay"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
